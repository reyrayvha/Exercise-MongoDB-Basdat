services:
  mongodb:
    image: mongo:8.0
    container_name: praktikum-mongodb

    command:
      - mongod
      - --replSet
      - rs0
      - --bind_ip_all

    ports:
      - "127.0.0.1:27017:27017"

    volumes:
      - mongodb_data:/data/db

    restart: unless-stopped

volumes:
  mongodb_data:
